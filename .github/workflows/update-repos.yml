name: Actualizar GitHub Profile README

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: update-profile-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Obtener métricas generales
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          USER="tatiana1104"
          API="https://api.github.com"
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"

          REPO_COUNT=$(curl -s $AUTH "$API/users/$USER" | jq '.public_repos')

          STAR_COUNT=$(curl -s $AUTH "$API/users/$USER/repos?per_page=100" \
            | jq '[.[].stargazers_count] | add')

          sed -i "s/📦 Repositorios públicos:.*/📦 Repositorios públicos: $REPO_COUNT/" README.md
          sed -i "s/⭐ Estrellas totales:.*/⭐ Estrellas totales: $STAR_COUNT/" README.md

      - name: Actualizar últimos repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          USER="tatiana1104"
          API="https://api.github.com"
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"

          REPOS=$(curl -s $AUTH "$API/users/$USER/repos?sort=updated&per_page=3" \
            | jq -r '.[].name')

          awk -v repos="$REPOS" -v user="$USER" '
          BEGIN {
            n = split(repos, arr, "\n")
          }
          {
            if ($0 ~ /<!--LATEST_REPOS-->/) {
              print "<!--LATEST_REPOS-->"
              for (i = 1; i <= n; i++) {
                print "- 🔹 [" arr[i] "](https://github.com/" user "/" arr[i] ")"
              }
              next
            }
            print
          }' README.md > README.tmp

          mv README.tmp README.md

      - name: Actualizar repositorios destacados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          USER="tatiana1104"
          API="https://api.github.com"
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"

          REPOS=$(curl -s $AUTH "$API/users/$USER/repos?per_page=100" \
            | jq -r 'sort_by(.stargazers_count) | reverse | .[0:3][] | "\(.name)|\(.stargazers_count)"')

          awk -v repos="$REPOS" -v user="$USER" '
          BEGIN {
            n = split(repos, arr, "\n")
          }
          {
            if ($0 ~ /<!--TOP_REPOS-->/) {
              print "<!--TOP_REPOS-->"
              for (i = 1; i <= n; i++) {
                split(arr[i], p, "|")
                print "- ⭐ [" p[1] "](https://github.com/" user "/" p[1] ") (" p[2] " ⭐)"
              }
              next
            }
            print
          }' README.md > README.tmp

          mv README.tmp README.md

      - name: Actualizar fecha de última actualización
        run: |
          DATE=$(date +"%d/%m/%Y")
          sed -i "s/<!--LAST_UPDATE-->/$DATE/" README.md

      - name: Commit y push de cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md
          git commit -m "Actualizar README del perfil automáticamente" || exit 0
          git push
