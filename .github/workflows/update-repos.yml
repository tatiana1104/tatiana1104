name: Actualizar número de repositorios

on:
  schedule:
    - cron: "0 0 * * *" # una vez al día
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Obtener número de repos públicos
        run: |
          COUNT=$(curl -s https://api.github.com/users/tatiana1104 | jq '.public_repos')
          sed -i "s/<!--REPO_COUNT-->.*<!--REPO_COUNT-->/<!--REPO_COUNT-->$COUNT<!--REPO_COUNT-->/" README.md

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git diff --quiet || git commit -am "🔄 Actualizar número de repositorios"
          git push
