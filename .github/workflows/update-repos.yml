name: Actualizar GitHub Profile README

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Obtener métricas generales
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="tatiana1104"
          API="https://api.github.com"
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"

          REPO_COUNT=$(curl -s $AUTH "$API/users/$USER" | jq -r '.public_repos // 0' || echo 0)

          STAR_COUNT=$(curl -s $AUTH "$API/users/$USER/repos?per_page=100" \
            | jq '[.[].stargazers_count] | add // 0' || echo 0)

          sed -i "s/📦 Repositorios públicos:.*/📦 Repositorios públicos: $REPO_COUNT/" README.md || true
          sed -i "s/⭐ Estrellas totales:.*/⭐ Estrellas totales: $STAR_COUNT/" README.md || true

          exit 0

      - name: Actualizar últimos repositorios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="tatiana1104"
          API="https://api.github.com"
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"

          REPOS=$(curl -s $AUTH "$API/users/$USER/repos?sort=updated&per_page=3" \
            | jq -r '.[].name' || true)

          awk -v repos="$REPOS" -v user="$USER" '
          BEGIN { n = split(repos, arr, "\n") }
          {
            if ($0 ~ /<!--LATEST_REPOS-->/) {
              print "<!--LATEST_REPOS-->"
              for (i = 1; i <= n; i++)
                print "- 🔹 [" arr[i] "](https://github.com/" user "/" arr[i] ")"
              next
            }
            print
          }' README.md > README.tmp || true

          mv README.tmp README.md || true
          exit 0

      - name: Actualizar repositorios destacados
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER="tatiana1104"
          API="https://api.github.com"
          AUTH="-H Authorization: Bearer $GITHUB_TOKEN"

          REPOS=$(curl -s $AUTH "$API/users/$USER/repos?per_page=100" \
            | jq -r 'sort_by(.stargazers_count) | reverse | .[0:3][] | "\(.name)|\(.stargazers_count)"' || true)

          awk -v repos="$REPOS" -v user="$USER" '
          BEGIN { n = split(repos, arr, "\n") }
          {
            if ($0 ~ /<!--TOP_REPOS-->/) {
              print "<!--TOP_REPOS-->"
              for (i = 1; i <= n; i++) {
                split(arr[i], p, "|")
                print "- ⭐ [" p[1] "](https://github.com/" user "/" p[1] ") (" p[2] " ⭐)"
              }
              next
            }
            print
          }' README.md > README.tmp || true

          mv README.tmp README.md || true
          exit 0

      - name: Actualizar fecha
        run: |
          DATE=$(date +"%d/%m/%Y")
          sed -i "s|🕒 Última actualización:.*|🕒 Última actualización: $DATE|" README.md || true
          exit 0

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add README.md
          git commit -m "Actualizar README del perfil" || echo "Sin cambios"
          git push || echo "Nada que subir"
          exit 0
