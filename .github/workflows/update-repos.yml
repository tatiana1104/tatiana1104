name: Actualizar repositorios

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Obtener métricas de GitHub
        run: |
          # Repos públicos
          REPO_COUNT=$(curl -s https://api.github.com/users/tatiana1104 | grep '"public_repos"' | sed 's/[^0-9]*//g')

          # Estrellas totales
          STAR_COUNT=$(curl -s "https://api.github.com/users/tatiana1104/repos?per_page=100" \
            | grep '"stargazers_count"' \
            | sed 's/[^0-9]*//g' \
            | awk '{s+=$1} END {print s}')

          echo "Repos: $REPO_COUNT"
          echo "Stars: $STAR_COUNT"

          sed -i "s/📦 Repositorios públicos:.*/📦 Repositorios públicos: $REPO_COUNT/" README.md
          sed -i "s/⭐ Estrellas totales:.*/⭐ Estrellas totales: $STAR_COUNT/" README.md
      - name: Actualizar últimos repositorios
        run: |
          REPOS=$(curl -s "https://api.github.com/users/tatiana1104/repos?sort=updated&per_page=3" \
            | grep '"name"' \
            | head -3 \
            | cut -d '"' -f4)

          awk -v repos="$REPOS" '
          BEGIN {
            split(repos, arr, "\n")
          }
          {
            if ($0 ~ /<!--LATEST_REPOS-->/) {
              for (i in arr) {
                print "- 🔹 [" arr[i] "](https://github.com/tatiana1104/" arr[i] ")"
              }
              next
            }
            print
          }
          ' README.md > README.tmp

          mv README.tmp README.md

      - name: Commit cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          git commit -m "Actualizar número de repositorios" || exit 0
          git push
